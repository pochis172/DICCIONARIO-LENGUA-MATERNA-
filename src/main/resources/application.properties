spring.application.name=diccionario-lengua-materna
server.port=${PORT:8080}

# MySQL. Funciona con XAMPP/MySQL usando root sin contraseña por defecto.
# Si tu instalación usa otra contraseña, define DB_PASSWORD antes de iniciar.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/diccionario_lengua_materna?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

server.servlet.session.timeout=8h
server.error.include-message=always
