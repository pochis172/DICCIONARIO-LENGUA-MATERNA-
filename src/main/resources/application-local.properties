# Base de datos H2 guardada en una carpeta del proyecto
spring.datasource.url=jdbc:h2:file:./data/diccionario-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crear o actualizar las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Acceso desde este equipo
server.address=127.0.0.1
